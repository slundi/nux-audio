[package]
name = "nux-audio"
authors = ["Sébastien LUNDI"]
version = "0.1.0"
edition = "2021"
keywords = ["nux", "midi", "sysex", "mighty", "plug"]
categories = ["command-line-utilities", "data-structures", "parsing"]
description = "Lib and CLI tool to command Nux devices such as Mighty Air/Plug/Space, MG-xxx"
homepage = "https://codeberg.org/slundi/nux-audio"
repository = "https://codeberg.org/slundi/nux-audio"

[features]

[dependencies]
anyhow = "1.0"                                             # snafu or thiserror instead?
clap = { version = "4.5", features = ["derive", "cargo"] }
midir = "0.10"
log = "0.4"                                                # flexi_logger = "0.31" ?
humantime = "2.2"
xdg = "3.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

# textwrap = "0.16"
# crossterm = "0.29"

tokio = { version = "1.47", features = ["full"] }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] } # For timestamps in presets

[dev-dependencies]
tokio-test = "0.4" # For async testing
criterion = "0.7"  # For benchmarking
# rstest = "0.25"
# test-case = "3.3"

# [[bench]]
# name = "effects_benchmark"
# harness = false

[lib]
name = "nux_audio"
path = "src/lib/lib.rs"

[[bin]]
name = "nux-cli"
path = "src/main.rs"
