[package]
name = "nux-audio"
authors = ["Sébastien LUNDI"]
version = "0.1.0"
edition = "2024"
keywords = ["nux", "midi", "sysex", "mighty", "plug"]
categories = ["command-line-utilities", "data-structures", "parsing"]
description = "Lib and CLI tool to command Nux devices such as Mighty Air/Plug/Space, MG-xxx"
homepage = "https://codeberg.org/slundi/nux-audio"
repository = "https://codeberg.org/slundi/nux-audio"

[features]

[dependencies]
bpaf = "0.9"
midir = "0.11"
humantime = "2.4"
xdg = "3.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

ratatui = "0.30"
crossterm = "0.29"

tokio = { version = "1.54", features = ["full"] }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "0.0.26"
chrono = { version = "0.4", features = ["serde"] } # For timestamps in presets

[dev-dependencies]
tokio-test = "0.4" # For async testing
criterion = "0.8"  # For benchmarking
rstest = "0.28"

# [[bench]]
# name = "effects_benchmark"
# harness = false

[lib]
name = "nux_audio"
path = "src/lib/lib.rs"

[[bin]]
name = "nux-cli"
path = "src/main.rs"
