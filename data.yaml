effects:
  - id: 0x50
    name: "Noise Gate"
    category: "utility"
    parameters:
      - name: "threshold"
        cc: 60
        range: [-60, 0] # dB
        default: -40
      - name: "attack"
        cc: 61
        range: [1, 100] # ms
        default: 10
      - name: "release"
        cc: 62
        range: [10, 1000] # ms
        default: 200
      - name: "bypass"
        cc: 65
        range: [0, 1]
        default: 0

  - id:
    name: Wah
    parameters:
      - name: param1
        cc:
        default: 50
        range: [0, 100] # %
      - name: param2
        cc:
        default: 50
        range: [0, 100] # %

tuner: chromatic # 0: chromatic, 1: guitar compensated, 2: guitar standard, 3: bass
# looper: int loop_state=0, int loop_undo_state=0, int loop_record_mode=0, double loop_level=0, (loop_has_audio=false)?
