device_families:
  # Famille Mighty Basic (Plug + Air) - Spécifications identiques
  mighty_basic_family:
    models: ["mighty_plug", "mighty_air"]
    # Effect slots in signal chain order (no efx/vol slot on basic family)
    signal_chain: [gate, comp, amp, ir, eq, mod, delay, reverb]
    shared_elements:
      preset_count: 7
      amp_models: 13
      ir_count: 20
      effects_count: 19
      bluetooth: true
      processors:
        - "Noise Gate"
        - "Compressor" 
        - "Amp Model (13 models)"
        - "Cabinet IR (20 IRs)"
        - "EQ (3-band)"
        - "Modulation Effects"
        - "Delay"
        - "Reverb"
      sysex_compatibility: "full"
      differences:
        mighty_plug: 
          form_factor: "headphone_amp"
        mighty_air: 
          form_factor: "desktop_amp"
          speaker: true
          ir_resolution: 512

  # Famille Mighty Pro (Pro + Space) - Architecture avancée
  mighty_pro_family:
    models: ["mighty_plug_pro", "mighty_space"]
    # Effect slots in signal chain order
    signal_chain: [gate, comp, efx, amp, ir, eq, mod, delay, reverb, vol]
    shared_elements:
      preset_count: 7
      amp_models: 20
      effects_count: 44
      secret_amps: 8
      bluetooth: true
      usb_interface: true
      ir_loader: true
      processors:
        - "Noise Gate"
        - "Compressor"
        - "Overdrive/Distortion"
        - "Amp Model (20 + 8 secret)"
        - "Cabinet Simulation + IR Loader"
        - "EQ (4-band)"
        - "40+ Effects"
        - "Reverb/Delay"
        - "Master Section"
      advanced_features:
        - "3rd party IR loading"
        - "USB audio interface"
        - "Bluetooth audio + app control"
        - "White-Box algorithm"
      sysex_compatibility: "full"
      differences:
        mighty_plug_pro:
          form_factor: "headphone_amp"
        mighty_space:
          form_factor: "desktop_amp"
          speaker: true
          rechargeable: true

  # Famille Mighty MKII Desktop
  mighty_mkii_family:
    models: ["mighty_8_bt", "mighty_20_bt", "mighty_40_bt", "mighty_60_bt"]
    # Effect slots in signal chain order
    signal_chain: [gate, comp, efx, amp, ir, eq, mod, delay, reverb]
    shared_elements:
      preset_count: 8
      form_factor: "combo_amp"
      bluetooth: true  # Seulement sur 8BT
      processors:
        - "Noise Gate"
        - "Compressor"
        - "Overdrive"
        - "Amp Models"
        - "Cabinet Simulation"
        - "EQ (3-4 band)"
        - "Modulation"
        - "Delay"
        - "Reverb"
      differences:
        mighty_8_bt:
          output_power: "8W"
          speaker_size: "5 inch"
          amp_models: 10
          effects_count: 15
        mighty_20_bt:
          output_power: "20W"
          speaker_size: "6.5 inch"
          amp_models: 12
          effects_count: 18
        mighty_40_bt:
          output_power: "40W"
          speaker_size: "8 inch"  
          amp_models: 12
          effects_count: 18
        mighty_60_bt:
          output_power: "60W"
          speaker_size: "10 inch"
          amp_models: 15
          effects_count: 20

  # Famille MG Multi-Effects
  mg_family:
    models: ["mg_30", "mg_101", "mg_300", "mg_300_mk2", "mg_400"]
    # Effect slots in signal chain order — matches mg30 keys in effects.yaml
    # Other MG models may differ; verify per device before sending SysEx
    signal_chain: [wah, comp, efx, amp, eq, gate, mod, delay, reverb, ir, vol]
    shared_elements:
      form_factor: "multi_effects"
      usb_interface: true
      processors:
        - "Input Gate"
        - "Compressor"
        - "Overdrive/Distortion"
        - "Amp Models"
        - "Cabinet Simulation"
        - "EQ"
        - "Modulation"
        - "Delay"
        - "Reverb"
        - "Master Volume"
      differences:
        mg_30:
          preset_count: 128
          amp_models: 30
          signal_blocks: 11
          ir_resolution: 1024
          features: ["4-inch color LCD", "NMP-2 footswitch", "Expression pedal", "Looper"]
        mg_101:
          preset_count: 100
          amp_models: 40
          effects_count: 60
        mg_300:
          preset_count: 200
          amp_models: 50
          effects_count: 80
        mg_300_mk2:
          preset_count: 256
          amp_models: 60
          effects_count: 100
        mg_400:
          preset_count: 300
          amp_models: 80
          effects_count: 120

sysex_compatibility_matrix:
  mighty_basic_family:
    compatible_with: ["mighty_plug", "mighty_air"]
    partial_compatibility: []

  mighty_pro_family:
    compatible_with: ["mighty_plug_pro", "mighty_space"]
    partial_compatibility: ["mighty_plug", "mighty_air"] # base commands only

  mighty_lite_family:
    compatible_with: ["mighty_lite_bt"]
    partial_compatibility: ["mighty_plug", "mighty_air"]

  mighty_bt_desktop_family:
    compatible_with: ["mighty_8_bt", "mighty_20_bt", "mighty_40_bt"]
    partial_compatibility: []

  mg_family:
    compatible_with: ["mg_30"]
    partial_compatibility: []

sysex_templates:
  # Mighty Basic/Pro - Changement de preset
  mighty_preset_change:
    template: [0xF0, 0x43, 0x58, "{device_id}", 0x00, "{preset_number}", 0xF7]
    compatible_devices: ["mighty_plug", "mighty_air", "mighty_plug_pro", "mighty_space"]
    parameters:
      - device_id: "Device ID (0x01-0x04)"
      - preset_number: "Preset number (0x00-0x06)"
      
  # Mighty Pro - Déblocage amplis secrets
  mighty_pro_secret_unlock:
    template: [0xF0, 0x43, 0x58, "{device_id}", 0x7F, 0x53, 0x45, 0x43, 0x52, 0x45, 0x54, 0xF7]
    compatible_devices: ["mighty_plug_pro", "mighty_space"]
    parameters:
      - device_id: "Device ID (0x03 or 0x04)"
      
  # MG-30 - Changement de preset avec scène
  mg30_preset_change:
    template: [0xF0, 0x43, 0x58, 0x09, 0x20, "{preset_number}", "{scene}", 0xF7]
    compatible_devices: ["mg_30"]
    parameters:
      - preset_number: "Preset number (0x00-0x7F)"
      - scene: "Scene number (0x00-0x03)"
      
  # MG-30 - Contrôle du looper
  mg30_looper_control:
    template: [0xF0, 0x43, 0x58, 0x09, 0x70, "{command}", 0xF7]
    compatible_devices: ["mg_30"]
    parameters:
      - command: "0x00=stop, 0x01=record, 0x02=play, 0x03=overdub"
