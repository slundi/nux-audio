        category: crunch
        knob_layout: [gain, master, bass, middle, treble, presence, bias, level]
      - id: 0x0D
        name: "SLO 100"
        full_name: "1980 Soldano SLO-100"
        category: high_gain
        knob_layout: [gain, master, bass, middle, treble, presence, bias, level]
      - id: 0x0E
        name: "Fireman HBE"
        full_name: "2005 Friedman HBE"
        category: high_gain
        knob_layout: [gain, master, bass, middle, treble, presence, bias, level]
      - id: 0x0F
        name: "Dual Rect"
        full_name: "1985 Mesa Dual Rectifier"
        category: high_gain
        knob_layout: [gain, master, bass, middle, treble, presence, bias, level]
      - id: 0x10
        name: "Die VH4"
        full_name: "1999 Diezel VH4"
        category: high_gain
        knob_layout: [gain, master, bass, middle, treble, presence, bias, level]
      - id: 0x11
        name: "Vibro King"
        full_name: "1990 Fender Vibro King"
        category: clean
        knob_layout: [gain, master, bass, middle, treble, presence, bias, level]
      - id: 0x12
        name: "Budda"
        full_name: "Budda"
        category: crunch
        knob_layout: [gain, master, cut, bass, middle, treble, level]
      - id: 0x13
        name: "Mr Z 38"
        full_name: "2001 Dr Z MAZ-38"
        category: clean
