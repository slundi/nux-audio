# Effects catalog for Nux audio devices
#
# Source of truth for effect models, knob parameters, and CC assignments.
# CC numbers come from MIDI_CC_assignments.md (MG-30 protocol).
# Model IDs marked [confirmed] are from reverse engineering of the device protocol.
# Model IDs marked [provisional] are inferred from sequential ordering and need
# hardware verification before being used in SysEx messages.
#
# Structure: one top-level key per device family, each containing effect slots
# in signal chain order with their models and knob definitions.

# ---------------------------------------------------------------------------
# MG-30 Versatile Modeler
# ---------------------------------------------------------------------------
mg30:
  # Fixed signal chain — 11 slots in processing order
  signal_chain: [wah, comp, efx, amp, eq, gate, mod, delay, reverb, ir, vol]

  wah:
    bypass_cc: 0
    models:
      # IDs provisional — inferred from on_byte pattern (on_byte = 2 * id) in wah.rs
      - id: 0x01
        name: "Clyde"
        full_name: "Clyde (60s Trumpet Sound)"
        knobs: []
      - id: 0x02
        name: "Cry BB"
        full_name: "Cry Baby"
        knobs: []
      - id: 0x03
        name: "V847"
        full_name: "Vox V847"
        knobs: []
      - id: 0x04
        name: "Horse Wah"
        full_name: "Morley Bad Horsie Wah"
        knobs:
          - {id: contour, label: "CONTOUR", cc: 11, range: [0, 100]}
          - {id: range,   label: "RANGE",   cc: 12, range: [0, 5]}
      - id: 0x05
        name: "Octave Shift"
        full_name: "Digitech Whammy"
        knobs:
          - {id: direction, label: "UP/DOWN", cc: 12, range: [0, 1]}

  comp:
    bypass_cc: 1
    models:
      # IDs provisional
      - id: 0x00
        name: "Rose Comp"
        full_name: "Ross Compressor"
        knobs:
          - {id: sustain, label: "SUSTAIN", cc: 13, range: [0, 100]}
          - {id: level,   label: "LEVEL",   cc: 14, range: [0, 100]}
      - id: 0x01
        name: "K Comp"
        full_name: "Keely Compressor"
        knobs:
          - {id: sustain,  label: "SUSTAIN",  cc: 13, range: [0, 100]}
          - {id: level,    label: "LEVEL",    cc: 14, range: [0, 100]}
          - {id: clipping, label: "CLIPPING", cc: 15, range: [0, 100]}
      - id: 0x02
        name: "Studio Comp"
        full_name: "Studio Compressor"
        knobs:
          - {id: threshold, label: "THRESHOLD", cc: 13, range: [0, 100]}
          - {id: ratio,     label: "RATIO",     cc: 14, range: [0, 100]}
          - {id: gain,      label: "GAIN",      cc: 15, range: [0, 100]}
          - {id: release,   label: "RELEASE",   cc: 90, range: [0, 100]}

  efx:
    bypass_cc: 2
    models:
      # IDs confirmed from reverse engineering
      - id: 0x40
        name: "Dist+"
        full_name: "MXR Distortion+"
        knobs:
          - {id: output, label: "OUTPUT",      cc: 17, range: [0, 100]}
          - {id: sens,   label: "SENSITIVITY", cc: 18, range: [0, 100]}
      - id: 0x41
        name: "RC Boost"
        full_name: "Xotic RC Booster"
        knobs:
          - {id: gain,   label: "GAIN",   cc: 17, range: [0, 100]}
          - {id: vol,    label: "VOL",    cc: 18, range: [0, 100]}
          - {id: bass,   label: "BASS",   cc: 19, range: [0, 100]}
          - {id: treble, label: "TREBLE", cc: 20, range: [0, 100]}
      - id: 0x42
        name: "AC Boost"
        full_name: "Xotic AC Booster"
        knobs:
          - {id: gain,   label: "GAIN",   cc: 17, range: [0, 100]}
          - {id: vol,    label: "VOL",    cc: 18, range: [0, 100]}
          - {id: bass,   label: "BASS",   cc: 19, range: [0, 100]}
          - {id: treble, label: "TREBLE", cc: 20, range: [0, 100]}
      - id: 0x43
        name: "Dist One"
        full_name: "Boss DS-1 Distortion"
        knobs:
          - {id: level, label: "LEVEL", cc: 17, range: [0, 100]}
          - {id: tone,  label: "TONE",  cc: 18, range: [0, 100]}
          - {id: drive, label: "DRIVE", cc: 19, range: [0, 100]}
      - id: 0x44
        name: "T Scream"
        full_name: "Ibanez Tube Screamer"
        knobs:
          - {id: drive, label: "DRIVE", cc: 17, range: [0, 100]}
          - {id: tone,  label: "TONE",  cc: 18, range: [0, 100]}
          - {id: level, label: "LEVEL", cc: 19, range: [0, 100]}
      - id: 0x45
        name: "Blues Drv"
        full_name: "Boss Blues Driver"
        knobs:
          - {id: level, label: "LEVEL", cc: 17, range: [0, 100]}
          - {id: tone,  label: "TONE",  cc: 18, range: [0, 100]}
          - {id: gain,  label: "GAIN",  cc: 19, range: [0, 100]}
      - id: 0x46
        name: "Morning Drv"
        full_name: "JHS Morning Glory"
        knobs:
          - {id: volume, label: "VOLUME", cc: 17, range: [0, 100]}
          - {id: drive,  label: "DRIVE",  cc: 18, range: [0, 100]}
          - {id: tone,   label: "TONE",   cc: 19, range: [0, 100]}
      - id: 0x47
        name: "EAT Dist"
        full_name: "ProCo RAT"
        knobs:
          - {id: distortion, label: "DISTORTION", cc: 17, range: [0, 100]}
          - {id: filter,     label: "FILTER",     cc: 18, range: [0, 100]}
          - {id: volume,     label: "VOLUME",     cc: 19, range: [0, 100]}
      - id: 0x48
        name: "Red Dirt"
        full_name: "Keely Red Dirt"
        knobs:
          - {id: drive, label: "DRIVE", cc: 17, range: [0, 100]}
          - {id: tone,  label: "TONE",  cc: 18, range: [0, 100]}
          - {id: level, label: "LEVEL", cc: 19, range: [0, 100]}
      - id: 0x49
        name: "Crunch"
        full_name: "JHS Angry Charlie"
        knobs:
          - {id: volume, label: "VOLUME", cc: 17, range: [0, 100]}
          - {id: tone,   label: "TONE",   cc: 18, range: [0, 100]}
          - {id: gain,   label: "GAIN",   cc: 19, range: [0, 100]}
      - id: 0x4A
        name: "Muff Fuzz"
        full_name: "EHX Big Muff Pi"
        knobs:
          - {id: volume,  label: "VOLUME",  cc: 17, range: [0, 100]}
          - {id: tone,    label: "TONE",    cc: 18, range: [0, 100]}
          - {id: sustain, label: "SUSTAIN", cc: 19, range: [0, 100]}
      - id: 0x4B
        name: "Katana"
        full_name: "Keely Katana Clean Boost"
        knobs:
          - {id: boost_sw, label: "BOOST SW", cc: 17, range: [0, 1]}
          - {id: volume,   label: "VOLUME",   cc: 18, range: [0, 100]}
      - id: 0x4C
        name: "Red Fuzz"
        full_name: "Silicon Fuzz"
        # knob labels [provisional] — CCs confirmed (EFX slot CC17–19)
        knobs:
          - {id: volume, label: "VOLUME", cc: 17, range: [0, 100]}
          - {id: tone,   label: "TONE",   cc: 18, range: [0, 100]}
          - {id: fuzz,   label: "FUZZ",   cc: 19, range: [0, 100]}
      - id: 0x4D
        name: "Touch Wah"
        full_name: "Envelope Auto-Wah"
        # knob labels [provisional] — CCs confirmed (EFX slot CC17–19)
        knobs:
          - {id: sens,  label: "SENSITIVITY", cc: 17, range: [0, 100]}
          - {id: range, label: "RANGE",        cc: 18, range: [0, 100]}
          - {id: level, label: "LEVEL",        cc: 19, range: [0, 100]}

  amp:
    bypass_cc: 3
    # All amp models share the same 8 CC slots in the same positions.
    # Not all amps use all 8 slots — see knob_layout per model.
    # CC22=GAIN, CC23=MASTER, CC24=BASS/CUT, CC25=MIDDLE,
    # CC26=TREBLE, CC27=PRESENCE/CUT, CC28=BIAS/BRIGHT_SW, CC29=LEVEL
    knob_ccs:
      gain:      22
      master:    23
      bass:      24
      cut:       24  # same CC as bass, different label on Vox/Matchless/Budda/MrZ
      middle:    25
      mid_freq:  25  # same CC, used on bass amps
      treble:    26
      presence:  27
      tone:      27  # same CC, used on Tweedy
      bright_sw: 28
      bias:      28  # same CC, different function per amp
      level:     29
    models:
      # IDs provisional — sequential 0x00..0x1D matching order in amp.rs
      - id: 0x00
        name: "Jazz Clean"
        full_name: "Roland JC-120"
        category: clean
        knob_layout: [gain, master, bass, middle, treble, bright_sw, level]
      - id: 0x01
        name: "Deluxe Rvb"
        full_name: "1964 Fender Deluxe Reverb"
        category: clean
        knob_layout: [gain, master, bass, middle, treble, bias, level]
      - id: 0x02
        name: "Bass Mate"
        full_name: "1959 Fender Bassman"
        category: clean
