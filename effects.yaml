      - id: 0x14
        name: "Super Rvb"
        full_name: "2008 Fender Supersonic"
        category: clean
        knob_layout: [gain, master, bass, middle, treble, bright_sw, bias, level]
      - id: 0x15
        name: "Brit Blues"
        full_name: "1967 Marshall JTM45"
        category: crunch
        knob_layout: [gain, master, bass, middle, treble, presence, bias, level]
      - id: 0x16
        name: "Match"
        full_name: "1986 Matchless DC30"
        category: crunch
        knob_layout: [gain, master, cut, bass, treble, level]
      - id: 0x17
        name: "Brit 2000"
        full_name: "Marshall JTM2000"
        category: high_gain
        knob_layout: [gain, master, bass, middle, treble, presence, bias, level]
      - id: 0x18
        name: "Uber"
        full_name: "Bogner Uberschall"
        category: high_gain
        knob_layout: [gain, master, bass, middle, treble, presence, bias, level]
      # Bass amps
      - id: 0x19
        name: "AGL"
        full_name: "Aguilar Tone Hammer Amp"
        category: bass
        knob_layout: [gain, master, bass, middle, mid_freq, treble, level]
      - id: 0x1A
        name: "Bassguy"
        full_name: "Bassman 100"
        category: bass
        knob_layout: [gain, master, bass, middle, treble, presence, level]
      - id: 0x1B
        name: "MLD"
        full_name: "NUX Melvin Lee Davis Amp"
        category: bass
        knob_layout: [gain, master, bass, middle, mid_freq, treble, level]
      # Acoustic amps
      - id: 0x1C
