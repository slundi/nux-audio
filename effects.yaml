  eq:
    bypass_cc: 4
    models:
      # IDs provisional
      - id: 0x00
        name: "6-Band EQ"
        full_name: "Boss GE-6"
        knobs:
          - {id: hz100,  label: "100Hz",  cc: 30, range: [0, 100]}
          - {id: hz220,  label: "220Hz",  cc: 31, range: [0, 100]}
          - {id: hz500,  label: "500Hz",  cc: 32, range: [0, 100]}
          - {id: khz12,  label: "1.2kHz", cc: 33, range: [0, 100]}
          - {id: khz26,  label: "2.6kHz", cc: 34, range: [0, 100]}
          - {id: khz64,  label: "6.4kHz", cc: 35, range: [0, 100]}
          - {id: level,  label: "LEVEL",  cc: 36, range: [0, 100]}
      - id: 0x01
        name: "Align EQ"
        full_name: "Align EQ"
        knobs:
          - {id: hpf,    label: "HPF",    cc: 30, range: [0, 2]}  # 0=50Hz 1=80Hz 2=160Hz
          - {id: hz110,  label: "110Hz",  cc: 31, range: [0, 100]}
          - {id: hz340,  label: "340Hz",  cc: 32, range: [0, 100]}
          - {id: hz660,  label: "660Hz",  cc: 33, range: [0, 100]}
          - {id: khz13,  label: "1.3kHz", cc: 34, range: [0, 100]}
          - {id: khz26,  label: "2.6kHz", cc: 35, range: [0, 100]}
          - {id: khz50,  label: "5.0kHz", cc: 36, range: [0, 100]}
          - {id: volume, label: "VOLUME", cc: 37, range: [0, 100]}
      - id: 0x02
        name: "10-Band EQ"
        full_name: "MXR 10 Band EQ"
        knobs:
          - {id: vol,    label: "VOL",   cc: 30, range: [0, 100]}
          - {id: hz31,   label: "31Hz",  cc: 31, range: [0, 100]}
          - {id: hz62,   label: "62Hz",  cc: 32, range: [0, 100]}
          - {id: hz125,  label: "125Hz", cc: 33, range: [0, 100]}
          - {id: hz250,  label: "250Hz", cc: 34, range: [0, 100]}
          - {id: hz500,  label: "500Hz", cc: 35, range: [0, 100]}
          - {id: khz1,   label: "1kHz",  cc: 36, range: [0, 100]}
          - {id: khz2,   label: "2kHz",  cc: 37, range: [0, 100]}
          - {id: khz4,   label: "4kHz",  cc: 38, range: [0, 100]}
          - {id: khz8,   label: "8kHz",  cc: 39, range: [0, 100]}
          - {id: khz16,  label: "16kHz", cc: 40, range: [0, 100]}
          - {id: gain,   label: "GAIN",  cc: 41, range: [0, 100]}
      - id: 0x03
        name: "Para EQ"
        full_name: "Parametric EQ"
        knobs:
          - {id: b1_freq, label: "BAND1 FREQ", cc: 30, range: [0, 100]}
          - {id: b1_gain, label: "BAND1 GAIN", cc: 31, range: [0, 100]}
          - {id: b1_q,    label: "BAND1 Q",    cc: 32, range: [0, 100]}
          - {id: b2_freq, label: "BAND2 FREQ", cc: 33, range: [0, 100]}
          - {id: b2_gain, label: "BAND2 GAIN", cc: 34, range: [0, 100]}
          - {id: b2_q,    label: "BAND2 Q",    cc: 35, range: [0, 100]}
          - {id: b3_freq, label: "BAND3 FREQ", cc: 36, range: [0, 100]}
          - {id: b3_gain, label: "BAND3 GAIN", cc: 37, range: [0, 100]}
          - {id: b3_q,    label: "BAND3 Q",    cc: 38, range: [0, 100]}

  gate:
    bypass_cc: 5
    models:
      # ID provisional — only one model on MG-30
      - id: 0x00
        name: "Noise Gate"
        knobs:
          - {id: sens,  label: "SENSITIVITY", cc: 42, range: [0, 100]}
          - {id: decay, label: "DECAY",       cc: 43, range: [0, 100]}
          # CC44 and CC45 present in MIDI_CC_assignments.md; labels [provisional]
          - {id: hold,  label: "HOLD",        cc: 44, range: [0, 100]}
          - {id: mode,  label: "MODE",        cc: 45, range: [0, 6]}

  mod:
    bypass_cc: 6
    models:
      # IDs confirmed from reverse engineering
      - id: 0x10
        name: "CE-1"
        full_name: "Roland CE-1 Chorus"
        knobs:
          - {id: intensity, label: "INTENSITY", cc: 46, range: [0, 100]}
          - {id: depth,     label: "DEPTH",     cc: 47, range: [0, 100]}
          - {id: rate,      label: "RATE",      cc: 48, range: [0, 100]}
          - {id: subdiv,    label: "SUB DIV",   cc: 49, range: [0, 6]}
      - id: 0x11
        name: "CE-2"
        full_name: "Roland CE-2 Chorus"
        knobs:
          - {id: rate,   label: "RATE",    cc: 46, range: [0, 100]}
          - {id: depth,  label: "DEPTH",   cc: 47, range: [0, 100]}
          - {id: subdiv, label: "SUB DIV", cc: 48, range: [0, 6]}
      - id: 0x12
        name: "ST. Chorus"
        full_name: "MXR Stereo Chorus"
        knobs:
          - {id: intensity, label: "INTENSITY", cc: 46, range: [0, 100]}
          - {id: width,     label: "WIDTH",     cc: 47, range: [0, 100]}
          - {id: rate,      label: "RATE",      cc: 48, range: [0, 100]}
          - {id: subdiv,    label: "SUB DIV",   cc: 49, range: [0, 6]}
      - id: 0x13
        name: "Vibrator"
        full_name: "Boss VB-2 Vibrato"
        knobs:
          - {id: rate,   label: "RATE",    cc: 46, range: [0, 100]}
          - {id: depth,  label: "DEPTH",   cc: 47, range: [0, 100]}
          - {id: subdiv, label: "SUB DIV", cc: 48, range: [0, 6]}
      - id: 0x14
        name: "Detune"
        full_name: "Stereo Detune"
        knobs:
          - {id: shift_l, label: "SHIFT LEFT",  cc: 46, range: [0, 100]}
          - {id: mix_l,   label: "MIX L",       cc: 47, range: [0, 100]}
          - {id: shift_r, label: "SHIFT RIGHT", cc: 48, range: [0, 100]}
          - {id: mix_r,   label: "MIX R",       cc: 49, range: [0, 100]}
      - id: 0x15
        name: "Flanger"
        full_name: "Boss BF-2 Flanger"
        knobs:
          - {id: level,  label: "LEVEL",   cc: 46, range: [0, 100]}
          - {id: rate,   label: "RATE",    cc: 47, range: [0, 100]}
          - {id: width,  label: "WIDTH",   cc: 48, range: [0, 100]}
          - {id: fback,  label: "F.BACK",  cc: 49, range: [0, 100]}
          - {id: subdiv, label: "SUB DIV", cc: 50, range: [0, 6]}
      - id: 0x16
        name: "Phase 90"
        full_name: "MXR Phase 90"
        knobs:
          - {id: speed,  label: "SPEED",   cc: 46, range: [0, 100]}
          - {id: subdiv, label: "SUB DIV", cc: 47, range: [0, 6]}
      - id: 0x17
        name: "Phase 100"
        full_name: "MXR Phase 100"
        knobs:
          - {id: intensity, label: "INTENSITY", cc: 46, range: [0, 100]}
          - {id: speed,     label: "SPEED",     cc: 47, range: [0, 100]}
          - {id: subdiv,    label: "SUB DIV",   cc: 48, range: [0, 6]}
      - id: 0x18
        name: "S.C.F."
        full_name: "TC Chorus SCF"
        knobs:
          - {id: speed,  label: "SPEED",     cc: 46, range: [0, 100]}
          - {id: width,  label: "WIDTH",     cc: 47, range: [0, 100]}
          - {id: mode,   label: "MODE",      cc: 48, range: [0, 2]}  # 0=CHORUS 1=PITCH MOD 2=FLANGER
          - {id: intens, label: "INTENSITY", cc: 49, range: [0, 100]}
          - {id: subdiv, label: "SUB DIV",   cc: 50, range: [0, 6]}
      - id: 0x19
        name: "U-Vibe"
        full_name: "Dunlop Univibe"
        knobs:
          - {id: speed,  label: "SPEED",          cc: 46, range: [0, 100]}
          - {id: volume, label: "VOLUME",          cc: 47, range: [0, 100]}
          - {id: intens, label: "INTENSITY",       cc: 48, range: [0, 100]}
          - {id: mode,   label: "CHORUS/VIBRATO",  cc: 49, range: [0, 1]}
          - {id: subdiv, label: "SUB DIV",         cc: 50, range: [0, 6]}
      - id: 0x1A
        name: "Tremolo"
        full_name: "Boss TR-3 Tremolo"
        knobs:
          - {id: rate,   label: "RATE",    cc: 46, range: [0, 100]}
          - {id: depth,  label: "DEPTH",   cc: 47, range: [0, 100]}
          - {id: subdiv, label: "SUB DIV", cc: 48, range: [0, 6]}
      - id: 0x1B
        name: "Rotar"
        full_name: "Rotary Speaker"
        knobs:
