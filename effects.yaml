        category: crunch
        knob_layout: [gain, master, bass, middle, treble, presence, bias, level]
      - id: 0x07
        name: "Class A 15"
        full_name: "Vox AC15"
        category: clean
        knob_layout: [gain, master, cut, bass, treble, level]
      - id: 0x08
        name: "Class A 30"
        full_name: "Vox AC30"
        category: clean
        knob_layout: [gain, master, cut, bass, treble, level]
      - id: 0x09
        name: "Plexi 100W"
        full_name: "1968 Marshall Plexi 100W"
        category: crunch
        knob_layout: [gain, master, bass, middle, treble, presence, bias, level]
      - id: 0x0A
        name: "Plexi 45"
        full_name: "1967 Marshall Plexi 45W"
        category: crunch
        knob_layout: [gain, master, bass, middle, treble, presence, bias, level]
      - id: 0x0B
        name: "Brit 800"
        full_name: "1977 Marshall JCM800"
        category: high_gain
        knob_layout: [gain, master, bass, middle, treble, presence, bias, level]
      - id: 0x0C
        name: "1987X 50W"
