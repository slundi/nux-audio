# Device registry for Nux audio devices.
#
# Embedded at compile time via include_str! — edit this file to add or modify
# supported devices; the change takes effect on the next build.
#
# Fields:
#   key              - internal slug (snake_case, unique)
#   name             - human-readable product name
#   model_code       - short code used in SysEx and CLI output ("MG-30", "MP-3", …)
#   device_id        - SysEx device byte (decimal) — must match devices.yaml
#   midi_channel     - MIDI channel (1-based)
#   preset_count     - number of user preset slots
#   midi_port_prefix - OS MIDI port name prefix used for auto-detection
#                      (longer prefixes must appear before shorter ones)
#   signal_chain     - effect slot names in signal-chain order

# ---------------------------------------------------------------------------
# MG-30 — Versatile Modeler
# ---------------------------------------------------------------------------
device:
  - key: mg_30
    name: "MG-30 Versatile Modeler"
    model_code: "MG-30"
    device_id: 9
    midi_channel: 1
    preset_count: 128
    midi_port_prefix: "NUX MG-30"
    signal_chain: [wah, comp, efx, amp, eq, gate, mod, delay, reverb, ir, vol]

# ---------------------------------------------------------------------------
# Mighty Plug Pro / Mighty Space — Advanced headphone amp family
# NOTE: "Mighty Plug Pro" must appear before "Mighty Plug" so the longer
# prefix is tried first by the registry (match_port uses longest-match).
# ---------------------------------------------------------------------------
  - key: mighty_plug_pro
    name: "Mighty Plug Pro MP-3"
    model_code: "MP-3"
    device_id: 3
    midi_channel: 1
    preset_count: 7
    midi_port_prefix: "NUX Mighty Plug Pro"
    signal_chain: [gate, comp, efx, amp, ir, eq, mod, delay, reverb, vol]

  - key: mighty_space
    name: "Mighty Space"
    model_code: "MS-1"
    device_id: 4
    midi_channel: 1
    preset_count: 7
    midi_port_prefix: "NUX Mighty Space"
    signal_chain: [gate, comp, efx, amp, ir, eq, mod, delay, reverb, vol]

# ---------------------------------------------------------------------------
# Mighty Basic — Mighty Plug MP-2 / Mighty Air
# ---------------------------------------------------------------------------
  - key: mighty_plug
