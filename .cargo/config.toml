[alias]
b  = "build"
br = "build --release"
c  = "check"
t  = "test"
r  = "run"
rr = "run --release"

# Faster linker on Linux — use mold when in the Nix devShell (flake.nix),
# otherwise fall back to lld which is available in the base Nix environment.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
